<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}The Marshall Project{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="page">

  <!-- Header -->
  <header class="site-header">
    <a href="{{ url_for('index') }}" class="logo">
      <img src="{{ url_for('static', filename='assets/Project Marshall Logo.png') }}"
           alt="The Marshall Project — A Hammer Haag Initiative" class="site-logo">
    </a>
    <div class="header-right-group">
      {% block header_right %}{% endblock %}
      {% if not (request.endpoint or '').startswith('supervisor') %}
      {% set here = request.full_path.rstrip('?') if request.method == 'GET' else url_for('index') %}
      <div class="lang-toggle" role="group" aria-label="Language / Idioma">
        <a href="{{ url_for('set_lang', code='en', next=here) }}" class="{{ 'active' if lang == 'en' }}" lang="en">EN</a>
        <a href="{{ url_for('set_lang', code='es', next=here) }}" class="{{ 'active' if lang == 'es' }}" lang="es">ES</a>
      </div>
      {% endif %}
      <a href="{{ url_for('supervisor_dashboard') }}" class="supervisor-link">{{ t('supervisor_dashboard') }}</a>
    </div>
  </header>

  {% block body %}{% endblock %}

</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
