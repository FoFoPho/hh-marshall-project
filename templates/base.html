<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}The Marshall Project{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="page">

  <!-- Header -->
  <header class="site-header">
    <a href="{{ url_for('index') }}" class="logo">
      <img src="{{ url_for('static', filename='assets/Project Marshall Logo.png') }}"
           alt="The Marshall Project — A Hammer Haag Initiative" class="site-logo">
    </a>
    <div class="header-right-group">
      {% block header_right %}{% endblock %}
      <a href="{{ url_for('supervisor_dashboard') }}" class="supervisor-link">Supervisor Dashboard</a>
    </div>
  </header>

  {% block body %}{% endblock %}

</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
